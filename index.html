<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crônicas de Valdária</title>
  <meta name="description" content="Idle MMORPG de navegador: escolha sua facção e classe, cace monstros, derrote chefes e upe até o nível 100.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>
  <!-- Seleção de personagem -->
  <section id="screen-select" class="screen">
    <div class="title-box">
      <h1>Crônicas de Valdária</h1>
      <p class="subtitle">Idle MMORPG · Escolha seu herói</p>
    </div>
    <div id="acct" class="acct hidden"></div>
    <div id="slots" class="slots"></div>
    <button class="btn primary install-btn hidden" id="install-btn">📲 Instalar o jogo no celular</button>
    <p class="muted center small-note" id="install-tip"></p>
    <p class="muted center small-note">Seu progresso fica salvo neste navegador. O herói continua caçando mesmo com o jogo fechado (até 8h).</p>
  </section>

  <!-- Criação -->
  <section id="screen-create" class="screen hidden">
    <div class="title-box"><h1>Criar Herói</h1></div>
    <div class="create-wrap">
      <div id="faction-tabs" class="faction-tabs"></div>
      <div id="class-grid" class="class-grid"></div>
      <div class="create-foot">
        <input id="char-name" maxlength="16" placeholder="Nome do herói" autocomplete="off">
        <button class="btn" id="create-back">Voltar</button>
        <button class="btn primary" id="create-btn" disabled>Criar herói</button>
        <button class="btn" id="create-full" disabled title="Para testar: cria o herói já no nível 100, com tudo no máximo">⭐ Criar no nível 100 (teste)</button>
      </div>
    </div>
  </section>

  <!-- Jogo -->
  <section id="screen-game" class="screen hidden">
    <div id="stage" class="stage">
      <div class="arena">
        <canvas id="scene"></canvas>
        <canvas id="scene3d"></canvas>
        <div id="floats3d" class="floats3d"></div>
        <div id="npc-labels" class="npc-labels"></div>
        <div id="mon-bars-layer" class="mon-bars-layer"></div>
        <div id="hit-flash" class="hit-flash"></div>
        <div id="pl-labels" class="npc-labels"></div>
      </div>

      <!-- personagem -->
      <div class="hud hud-left" id="player-card">
        <div class="pc-top"><span class="pc-lvl" id="hdr-lvl"></span><b class="f-name" id="p-name"></b></div>
        <div id="p-bars"></div>
        <div class="pc-money"><span>💰 <b id="hdr-gold"></b></span><span>💎 <b id="hdr-stones"></b></span></div>
        <div id="p-buffs" class="buffs"></div>
      </div>
      <div id="hdr-name" class="hidden"></div>

      <!-- topo central -->
      <div class="hud-top">
        <div id="zone-title"></div>
        <div class="arena-btns">
          <button class="btn small auto" id="auto-btn">🤖 Auto: ON</button>
          <button class="btn small town" id="town-btn">🏰 Cidade</button>
          <button class="btn small boss" id="boss-btn"></button>
        </div>
      </div>

      <div id="boss-bar" class="boss-bar hidden"></div>
      <div id="tut" class="tut hidden"></div>

      <!-- alvo, minimapa e missões -->
      <div class="hud-right-col">
        <div class="hud" id="mon-card">
          <div class="f-name" id="mon-name"></div>
          <div id="mon-bars"></div>
        </div>
        <div class="minimap-wrap"><canvas id="minimap" width="150" height="150"></canvas><span id="mm-label"></span></div>
        <div class="quest-track" id="quest-track"></div>
      </div>

      <div id="npc-bar" class="npc-bar hidden">
        <button class="btn small" data-npc="guarda">⚔️ Comandante</button>
        <button class="btn small" data-npc="mercador">🛒 Mercadora</button>
        <button class="btn small" data-npc="ferreiro">🔨 Ferreiro</button>
        <button class="btn small" data-npc="portal">🌀 Portais</button>
        <button class="btn small" data-npc="mestra">📜 Mestra</button>
        <button class="btn small" data-npc="bau">🧰 Baú</button>
        <button class="btn small" data-npc="ordem">📿 Ordem</button>
      </div>

      <!-- chat -->
      <div class="chat" id="chat">
        <div class="chat-tabs">
          <button class="chat-tab active" data-chat="todos">Todos</button>
          <button class="chat-tab" data-chat="combate">Combate</button>
          <button class="chat-tab" data-chat="sistema">Sistema</button>
          <button class="chat-tab chat-min" id="chat-min" title="Minimizar">▾</button>
        </div>
        <div id="log" class="log"></div>
        <form class="chat-form" id="chat-form" autocomplete="off"><input id="chat-input" maxlength="120" placeholder="Digite uma mensagem... (/ajuda)"><button class="btn small" type="submit">➤</button></form>
      </div>

      <!-- barra inferior -->
      <div class="bottom-bar">
        <div class="hotbar">
          <button class="pot-slot" data-pot="hp" title="Poção de vida (Q)"><span>❤️</span><em id="pot-hp">0</em><kbd>Q</kbd></button>
          <div id="skill-bar" class="skill-bar"></div>
          <button class="pot-slot" data-pot="mp" title="Poção de mana (E)"><span>💙</span><em id="pot-mp">0</em><kbd>E</kbd></button>
        </div>
        <div id="xp-bar" class="xp-wrap"></div>
      </div>

      <!-- menus -->
      <nav class="menu-btns">
        <button data-win="personagem" title="Personagem (C)">👤<small>Herói</small></button>
        <button data-win="inventario" title="Itens (I)">🎒<small>Itens</small></button>
        <button data-win="habilidades" title="Habilidades (K)">📜<small>Skills</small></button>
        <button data-win="missoes" title="Missões (J)">📋<small>Missões</small></button>
        <button data-win="mapas" title="Mapas (M)">🗺️<small>Mapas</small></button>
        <button data-win="conquistas" title="Conquistas (L)">🏆<small>Feitos</small></button>
        <button data-win="ranking" title="Ranking (R)">🏅<small>Ranking</small></button>
        <button data-win="social" title="Grupo e Guilda (G)">👥<small>Social</small></button>
        <button data-win="alma" title="Alma e Artefatos (H)">🔮<small>Alma</small></button>
        <button data-win="config" title="Configurações">⚙️<small>Config</small></button>
        <button id="mute-btn" title="Som">🔊</button>
        <button id="btn-exit" title="Trocar herói">🚪</button>
      </nav>

      <!-- janela -->
      <div id="gwin" class="gwin hidden">
        <div class="gwin-head"><b id="gwin-title"></b><button class="gwin-x" id="gwin-close">✕</button></div>
        <div class="gwin-body">
          <div id="win-personagem" class="win-pane"><div class="panel" id="equip-panel"></div><div class="panel" id="char-panel"></div></div>
          <div id="tab-content" class="win-pane tab-content"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-body"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/GLTFLoader.js"></script>
  <script src="js/vendor/SkeletonUtils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
  <script>
    // aplicativo instalável (PWA): funciona quando o jogo está no próprio domínio
    try { if ('serviceWorker' in navigator && window.top === window.self) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
    let installEvt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; document.getElementById('install-btn').classList.remove('hidden'); });
    document.getElementById('install-btn').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; document.getElementById('install-btn').classList.add('hidden'); });
    (() => { const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      if (ios && !standalone && window.top === window.self) document.getElementById('install-tip').textContent = 'No iPhone: toque em Compartilhar ➜ "Adicionar à Tela de Início" para instalar.'; })();
  </script>
</body>
</html>
